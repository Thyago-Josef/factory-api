quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.acquisition-timeout=50

# CONFIGURAÇÃO DINÂMICA (Usa a variável de ambiente ou o valor padrão depois do ':')
quarkus.datasource.username=${DB_USER:APP_QUARKUS}
quarkus.datasource.password=${DB_PASS:quarkus}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}

# Hibernate e Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true

quarkus.flyway.schemas=APP_QUARKUS


# Habilita o CORS para desenvolvimento
#quarkus.http.cors=true
#quarkus.http.cors.origins=http://localhost:5173
#quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
#quarkus.http.cors.headers=Content-Type,Authorization


quarkus.http.cors=true
# Aqui você pode passar uma lista separada por vírgula
quarkus.http.cors.origins=http://localhost:5173,${FRONTEND_URL:https://seu-front.vercel.app}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=origin,content-type,accept,authorization,x-requested-with

