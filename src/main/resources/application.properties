quarkus.datasource.db-kind=oracle
#quarkus.datasource.username=system
# Espera até 50 segundos pelo banco
quarkus.datasource.jdbc.acquisition-timeout=50
#quarkus.datasource.password=quarkus
quarkus.datasource.username=APP_QUARKUS
quarkus.datasource.password=quarkus
# localhost aponta para o container do Docker
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
quarkus.hibernate-orm.database.generation=none

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true


